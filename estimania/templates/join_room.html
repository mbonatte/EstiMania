{% extends 'base.html' %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh; padding: 1rem 0;">
	<div class="glass-card" style="width: 100%; max-width: 460px; border-top: 4px solid var(--accent-sapphire);">
		<div style="text-align: center; margin-bottom: 2rem;">
			<div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 16px; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); font-size: 1.75rem; margin-bottom: 1rem;">
				🚪
			</div>
			<h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Join a Table</h1>
			<p style="color: var(--text-muted); font-size: 0.95rem;">Enter the room name and your nickname to take a seat.</p>
		</div>

		<form id="joinRoomForm">
			<div class="form-group">
				<label for="username">Your Nickname</label>
				<input type="text" id="username" name="username" placeholder="e.g. CardShark" required autocomplete="username">
			</div>

			<div class="form-group">
				<label for="roomID">Room Name / ID</label>
				<input type="text" id="roomID" name="roomID" placeholder="e.g. ChampionsLounge" required autocomplete="off">
			</div>

			<div class="form-group">
				<label for="pin">Room PIN <span style="font-weight: 400; color: var(--text-dim); text-transform: none;">(If protected)</span></label>
				<input type="text" id="pin" name="pin" placeholder="Leave blank if public" pattern="[0-9]*" inputmode="numeric">
			</div>

			<button id="joinRoomButton" type="submit" class="btn" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
				<span>🎯</span> Join Table
			</button>
		</form>
	</div>
</div>

<script>
	// Auto-fill saved username
	const savedUser = localStorage.getItem('username');
	if (savedUser) {
		const userField = document.getElementById('username');
		if (userField) userField.value = savedUser;
	}

	document.getElementById('joinRoomForm').addEventListener('submit', function(event) {
		event.preventDefault();
		var username = document.getElementById('username').value.trim();
		var roomID = document.getElementById('roomID').value.trim();

		if (!username || !roomID) return;

		localStorage.setItem('username', username);
		window.location.href = '/rooms/' + encodeURIComponent(roomID);
	});
</script>
{% endblock %}
