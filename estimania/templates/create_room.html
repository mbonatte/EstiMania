{% extends 'base.html' %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh; padding: 1rem 0;">
	<div class="glass-card" style="width: 100%; max-width: 460px; border-top: 4px solid var(--primary);">
		<div style="text-align: center; margin-bottom: 2rem;">
			<div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 16px; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); font-size: 1.75rem; margin-bottom: 1rem;">
				🎲
			</div>
			<h1 data-i18n="create.title" style="font-size: 1.75rem; margin-bottom: 0.5rem;">Create a Table</h1>
			<p data-i18n="create.desc" style="color: var(--text-muted); font-size: 0.95rem;">Host a game room to challenge friends or test against AI bots.</p>
		</div>

		<form id="createRoomForm">
			<div class="form-group">
				<label for="username" data-i18n="create.nickname">Your Nickname</label>
				<input type="text" id="username" name="username" placeholder="e.g. AceHigh" data-i18n-placeholder="create.nicknamePlaceholder" required autocomplete="username">
			</div>

			<div class="form-group">
				<label for="room-id" data-i18n="create.roomName">Room Name / ID</label>
				<input type="text" id="room-id" name="room" placeholder="e.g. ChampionsLounge" data-i18n-placeholder="create.roomPlaceholder" required autocomplete="off">
			</div>

			<div class="form-group">
				<label for="pin"><span data-i18n="create.pin">Private PIN</span> <span data-i18n="create.pinOptional" style="font-weight: 400; color: var(--text-dim); text-transform: none;">(Optional)</span></label>
				<input type="text" id="pin" name="pin" placeholder="Leave blank for public room" data-i18n-placeholder="create.pinPlaceholder" pattern="[0-9]*" inputmode="numeric">
			</div>

			<button id="createRoomButton" type="submit" class="btn btn-emerald" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
				<span>✨</span> <span data-i18n="create.btnSubmit">Create & Join Table</span>
			</button>
		</form>
	</div>
</div>

<script>
	// Auto-fill saved username
	const savedUser = localStorage.getItem('username');
	if (savedUser) {
		const userField = document.getElementById('username');
		if (userField) userField.value = savedUser;
	}

	document.getElementById('createRoomForm').addEventListener('submit', function(event) {
		event.preventDefault();
		
		var username = document.getElementById('username').value.trim();
		var roomName = document.getElementById('room-id').value.trim();
		var pin = document.getElementById('pin').value.trim();
		
		if (!username || !roomName) return;

		var data = {
			username: username,
			roomName: roomName,
			pin: pin
		};
		
		localStorage.setItem('username', username);
		
		var submitBtn = document.getElementById('createRoomButton');
		submitBtn.disabled = true;
		submitBtn.textContent = 'Creating Table...';

		fetch('/create_room', {
			method: 'POST',
			headers: {
				'Content-Type': 'application/json'
			},
			body: JSON.stringify(data)
		})
		.then(function(response) {
			return response.json();
		})
		.then(function(data) {
			var roomID = data.room_id;
			window.location.href = '/rooms/' + encodeURIComponent(roomID);
		})
		.catch(function(error) {
			console.error('Error:', error);
			submitBtn.disabled = false;
			submitBtn.textContent = 'Create & Join Table';
			alert('Failed to create room. Please try again.');
		});
	});
</script>
{% endblock %}
