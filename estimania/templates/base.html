<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests"> 
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

		<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
		<link rel="stylesheet" href="{{ url_for('static', filename='style_menu.css') }}" />
		<link rel="stylesheet" href="{{ url_for('static', filename='style_mobile_general.css') }}" />
		
		<title>EstiMania - Card Game</title>
	</head>
<body>
	<nav>
		<div class="nav-container">
			<a href="/home" class="logo">
				<img src="{{ url_for('static', filename='logo_menu.png') }}" alt="EstiMania Logo" />
			</a>

			<div class="suit-hierarchy-badge" title="Suit Hierarchy: Diamonds/Gold beats Spades, Hearts, and Clubs!">
				<span data-i18n="nav.hierarchy">Hierarchy:</span>
				<span class="diamonds" data-i18n="nav.diamonds">♦ Gold</span> &gt;
				<span class="spades" data-i18n="nav.spades">♠ Sword</span> &gt;
				<span class="hearts" data-i18n="nav.hearts">♥ Cups</span> &gt;
				<span class="clubs" data-i18n="nav.clubs">♣ Clubs</span>
			</div>

			<button class="menu-toggle" aria-label="Toggle navigation" onclick="toggleMobileMenu()">
				<span></span>
				<span></span>
				<span></span>
			</button>

			<ul id="menu" class="menu">
				<li><a href="/create_room" data-i18n="nav.createRoom">Create Room</a></li>
				<li><a href="/browse_rooms" data-i18n="nav.browseRooms">Browse Rooms</a></li>
				<li><a href="/about" data-i18n="nav.aboutRules">About & Rules</a></li>
				<li>
					<button id="globalLangToggleBtn" class="btn btn-lang-toggle" onclick="toggleLanguage()" title="Switch Language / Mudar Idioma">
						<span>🌐</span> <span id="langToggleLabel">🇺🇸 EN</span>
					</button>
				</li>
			</ul>
		</div>
	</nav>
	
	<div id="mobile-menu" class="mobile-menu">
		<a href="/create_room" data-i18n="nav.createRoom">Create Room</a>
		<a href="/browse_rooms" data-i18n="nav.browseRooms">Browse Rooms</a>
		<a href="/about" data-i18n="nav.aboutRules">About & Rules</a>
		<div style="padding: 0.5rem 1rem;">
			<button id="mobileLangToggleBtn" class="btn btn-lang-toggle" onclick="toggleLanguage()" style="width: 100%; justify-content: center;">
				<span>🌐</span> <span id="mobileLangToggleLabel">🇺🇸 EN</span>
			</button>
		</div>
		<div class="mobile-suit-hierarchy">
			<span data-i18n="nav.hierarchy">Hierarchy:</span>
			<span class="diamonds" data-i18n="nav.diamonds">♦ Gold</span> &gt;
			<span class="spades" data-i18n="nav.spades">♠ Sword</span> &gt;
			<span class="hearts" data-i18n="nav.hearts">♥ Cups</span> &gt;
			<span class="clubs" data-i18n="nav.clubs">♣ Clubs</span>
		</div>
	</div>

	<main class="content">
		{% block content %} {% endblock %}
	</main>

	<script type="module">
		import i18n from "{{ url_for('static', filename='i18n.js') }}";
		window.i18n = i18n;
		window.toggleLanguage = function() {
			const lang = i18n.toggleLanguage();
			updateLangLabels(lang);
		};

		function updateLangLabels(lang) {
			const label = lang === 'pt-BR' ? '🇧🇷 PT' : '🇺🇸 EN';
			const desktop = document.getElementById('langToggleLabel');
			const mobile = document.getElementById('mobileLangToggleLabel');
			const room = document.getElementById('roomLangToggleLabel');
			if (desktop) desktop.textContent = label;
			if (mobile) mobile.textContent = label;
			if (room) room.textContent = label;
		}

		document.addEventListener('DOMContentLoaded', () => {
			i18n.applyTranslations();
			updateLangLabels(i18n.getLanguage());
		});
	</script>
	<script>
		function toggleMobileMenu() {
			var mobile_menu = document.getElementById("mobile-menu");
			mobile_menu.classList.toggle("show");
		}
	</script>
</body>
</html>
