{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='style_room.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='style_mobile_room.css') }}" />

<script src="//cdnjs.cloudflare.com/ajax/libs/socket.io/4.2.0/socket.io.js"></script>
<script src="//code.jquery.com/jquery-3.6.0.min.js"></script>

<div class="room-topbar">
    <div class="room-topbar-info">
        <div class="room-badge">
            <span class="dot"></span>
            <span>Room: {{ room_id if room_id else 'Live Table' }}</span>
        </div>
    </div>
    <div class="room-topbar-actions" style="display: flex; align-items: center; gap: 0.5rem;">
        <button id="roomLangToggleBtn" class="btn btn-lang-toggle" onclick="toggleLanguage()" title="Switch Language / Mudar Idioma">
            <span>🌐</span> <span id="roomLangToggleLabel">🇺🇸 EN</span>
        </button>
        <button id="coachModeToggleBtn" class="btn btn-coach-toggle active" title="Toggle Coach Mode for tips and probabilities">
            <span class="coach-icon">🎓</span> <span id="coachModeLabel">Coach: ON</span>
        </button>
        <button id="viewOverallPointsBtnTop" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.5rem 0.85rem;">
            <span>🏆</span> <span data-i18n="room.standings">Standings</span>
        </button>
        <button id="startGameButton" class="btn btn-emerald">
            <span>♠</span> <span data-i18n="room.startMatch">Start Match</span>
        </button>
    </div>
</div>

<div id="coachTipBanner" class="coach-tip-banner" style="display: none;">
    <div class="coach-tip-content">
        <span class="coach-tip-badge" data-i18n="turn.coachTipBadge">🎓 Coach Tip</span>
        <span class="coach-tip-text" id="coachTipText"></span>
    </div>
</div>

<div id="container">
    <div id="tableArea">
        <div class="table-empty-hint">
            <span data-i18n="room.tableEmpty">Played cards will appear here</span>
        </div>
    </div>

    <div id="handArea"></div>
    
    <button id="scoreToggleButton" class="toggle-button" data-content="Scores">Show Scores</button>
    <div id="scoreAreaWrapper" class="toggle-wrapper">
        <div class="score-header-row">
            <div id="roundArea"><span>🃏</span> <span data-i18n="room.waitingDeal">Waiting to deal...</span></div>
            <button id="viewOverallPointsBtn" class="btn-points-toggle" title="View overall match points">
                <span>🏆</span> <span data-i18n="room.points">Points</span>
            </button>
        </div>
        <table id="scoreArea" class="score-table">
            <thead>
                <tr>
                    <th data-i18n="score.player">Player</th>
                    <th data-i18n="score.bid">Bid</th>
                    <th data-i18n="score.tricks">Tricks</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <button id="messageToggleButton" class="toggle-button" data-content="Messages">Show Chat</button>
    <div id="messageWrapper" class="toggle-wrapper">
        <div class="chat-header" data-i18n="room.tableChat">Table Chat</div>
        <div id="messageArea"></div>
        <form id="chatForm">
            <input type="text" id="message" placeholder="Type a message..." data-i18n-placeholder="room.chatPlaceholder" autocomplete="off">
            <button type="submit" class="btn btn-secondary" data-i18n="room.send">Send</button>
        </form>
    </div>
</div>

<script type="module" src="{{ url_for('static', filename='main.js') }}"></script>

<script>
    function toggleVisibility(wrapperId, buttonId) {
        var wrapper = document.getElementById(wrapperId);
        var button = document.getElementById(buttonId);
        var contentName = button.getAttribute("data-content");
        if (wrapper.style.display === "none" || wrapper.style.display === "") {
            wrapper.style.display = "flex";
            button.textContent = "Hide " + contentName;
        } else {
            wrapper.style.display = "none";
            button.textContent = "Show " + contentName;
        }
    }

    function resetVisibilityOnResize() {
        var scoreWrap = document.getElementById('scoreAreaWrapper');
        var msgWrap = document.getElementById('messageWrapper');
        var scoreBtn = document.getElementById('scoreToggleButton');
        var msgBtn = document.getElementById('messageToggleButton');

        if (window.innerWidth >= 901) {
            scoreWrap.style.display = 'flex';
            msgWrap.style.display = 'flex';
            scoreBtn.style.display = 'none';
            msgBtn.style.display = 'none';
        } else {
            scoreBtn.style.display = 'flex';
            msgBtn.style.display = 'flex';
            scoreWrap.style.display = 'none';
            msgWrap.style.display = 'none';
            scoreBtn.textContent = "Show Scores";
            msgBtn.textContent = "Show Chat";
        }
    }

    document.getElementById('scoreToggleButton').onclick = function() {
        toggleVisibility('scoreAreaWrapper', 'scoreToggleButton');
    };
    document.getElementById('messageToggleButton').onclick = function() {
        toggleVisibility('messageWrapper', 'messageToggleButton');
    };

    window.addEventListener('resize', resetVisibilityOnResize);
    window.addEventListener('load', resetVisibilityOnResize);
</script>
{% endblock %}
